# 按仓库真实路径分配区域标签；标签由维护者统一建立。
"area: docs":
  - changed-files:
      - any-glob-to-any-file: ["*.md", "docs/**", "changelog/**"]
"area: tests":
  - changed-files:
      - any-glob-to-any-file: ["**/*_test.go", "mcptest/**", "**/testdata/**"]
"area: github-actions":
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
"area: agent":
  - changed-files:
      - any-glob-to-any-file: ["agent.go", "internal/agent/**", "provider/**", "plugin_config_schema.json", "assets/**", "cmd/**", "plugin.yaml", "i18n/**", "go.mod", "go.sum"]
